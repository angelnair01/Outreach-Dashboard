<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Outreach Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M7 11l9 6 9-6M7 10h18v13H7z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply saved theme before the page paints (avoids a white flash in dark mode). */
    try { var t = JSON.parse(localStorage.getItem('og.theme')); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="app" hidden>
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Outreach</span></div>
      <ul class="nav" id="nav"></ul>
      <div class="sync" id="sync-status" aria-live="polite"></div>
    </nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div id="signin" class="signin" hidden></div>

  <aside id="panel" class="panel" aria-hidden="true" aria-label="Contact details">
    <div class="panel-inner" id="panel-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/pipeline.js"></script>
  <script src="js/pages/replies.js"></script>
  <script src="js/pages/followups.js"></script>
  <script src="js/pages/contacts.js"></script>
  <script src="js/pages/leads.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
